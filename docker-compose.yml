# docker-compose.yml
# ------------------
# Local stack: Postgres, the API, and the worker.
#
# The API and worker are the same image with different entrypoints. They are
# separate *processes* rather than threads in one, because a backtest is
# CPU-bound pandas work — running it in the API process would block the event
# loop and stall every other request, including the one a human is using to
# stop trading.
#
# The frontend deploys to Vercel and talks to the API over HTTPS; a Next.js
# server cannot hold a trading loop and does not try. It is therefore *not* in
# the default set — bringing it up here would suggest it is part of the
# deployment, and it is not.
#
# It is available behind a profile, because the UI is the only part of this
# system a human actually looks at and testing it should not require running
# npm separately from everything else:
#
#   docker compose up --build                    # backend only, as deployed
#   docker compose --profile web up --build      # everything, for local testing
#
# Requires Compose V2. `profiles:` and `depends_on: condition:` below are V2
# features, and this file carries no `version:` key — which V2 reads as "current
# schema" and the end-of-life V1 reads as the legacy version-1 format, which has
# none of them. V1 misreads it rather than failing cleanly, so do not substitute
# the hyphenated `docker-compose`. A missing V2 plugin reports as
# `unknown flag: --profile` against docker's own usage, which names the flag
# rather than the cause; SETUP.md covers the fix.
#
# Secrets
# ~~~~~~~
# No credential is written in this file — not even a placeholder or a default.
# Every service reads them from `.env`, which is gitignored. That keeps
# password-shaped literals out of version control entirely, and it removes the
# weak-default failure where `docker compose up` without configuration would
# quietly start a database with a guessable password.
#
#   cp .env.example .env
#   # fill in POSTGRES_PASSWORD, SESSION_SECRET, ADMIN_PASSWORD_HASH
#   docker compose up --build
#   docker compose run --rm api python -m src.db.migrate_cli
#
# One shared file means every service is handed every key, so which process
# holds which is decided below, by blanking, and not by what `.env` contains:
#
#   worker     holds the broker keys    blanks SECRETS_KEY and the model keys
#   programme  holds the model keys     blanks the broker keys
#   api        holds SECRETS_KEY        blanks the model keys, and still holds
#                                       the broker keys; its block says why
#
# tests/unit/test_secret_isolation.py asserts each of those against this file.

services:
  db:
    image: postgres:16-alpine
    # POSTGRES_PASSWORD is supplied by .env, never written here.
    env_file:
      - .env
    environment:
      POSTGRES_USER: trader
      POSTGRES_DB: trader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      # Interpolated from .env — this file holds no literal value.
      DATABASE_URL: postgresql://trader:${POSTGRES_PASSWORD}@db:5432/trader
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Two of the three independent gates on real money; the third is the
      # deployment's own mode. The database kill switch is a fourth and fails
      # closed. Leave both false.
      LIVE_TRADING_ENABLED: "false"
      ALPACA_ALLOW_LIVE: "false"
      # Blanked on purpose, overriding whatever `.env` holds.
      #
      # This process commands the worker and needs no model credential of its
      # own. It *stores* one, encrypting it under SECRETS_KEY, and it reports
      # whether one is set by reading the `secrets` row — never by reading
      # these variables — so blanking them cannot make the configuration page
      # say anything untrue. The programme's environment fallback means both
      # can legitimately be in `.env`, and without the override this process
      # would inherit them for nothing.
      #
      # Not blanked, and worth knowing: ALPACA_KEY_ID and ALPACA_SECRET_KEY.
      # `/system/status` reports `broker_configured` from them, and a blank
      # here would read "not configured" while the worker held a working pair.
      ANTHROPIC_API_KEY: ""
      TYPESAFE_API_KEY: ""
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m src.worker.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://trader:${POSTGRES_PASSWORD}@db:5432/trader
      LIVE_TRADING_ENABLED: "false"
      ALPACA_ALLOW_LIVE: "false"
      WORKER_ID: worker-1
      # Blanked on purpose, overriding whatever `.env` holds.
      #
      # This process holds the broker credentials and is the only one that
      # submits an order. It can also read every row in the database, including
      # the encrypted `secrets` table — so the only thing between it and a model
      # credential is not holding the key that decrypts one. Without these
      # lines it inherits all three from the shared env_file, and the separation
      # is a comment rather than a fact.
      #
      # TYPESAFE_API_KEY is the Jev model credential. Like ANTHROPIC_API_KEY it
      # belongs to the programme alone, vault first and environment second, so
      # it is a second model key this process must not hold — blanked before
      # the integration that reads it lands rather than after.
      #
      # The same boundary tests/unit/test_import_boundaries.py enforces on
      # imports, expressed in which process holds which key. Asserted by
      # tests/unit/test_secret_isolation.py against this file.
      SECRETS_KEY: ""
      ANTHROPIC_API_KEY: ""
      TYPESAFE_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy

  # The AI programme. Behind a profile, not in the default set, because it is
  # the only service that needs an ANTHROPIC_API_KEY and the stack must come up
  # without one.
  #
  #   docker compose --profile programme up --build
  #
  # It builds from the same image but installs one extra requirements file, so
  # `anthropic` exists in this container and in no other. That is the same
  # boundary the import test asserts in source form, expressed in the image: the
  # API and worker containers could not import an LLM client if their code
  # tried.
  programme:
    profiles: ["programme"]
    build:
      context: .
      dockerfile: Dockerfile.programme
    command: python -m src.programme.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://trader:${POSTGRES_PASSWORD}@db:5432/trader
      # Stated explicitly even though this process cannot reach a venue. The
      # variables are read by `get_settings`, which every process calls, and
      # leaving them unstated here would make this the one service whose
      # posture had to be inferred.
      LIVE_TRADING_ENABLED: "false"
      ALPACA_ALLOW_LIVE: "false"
      # The worker's blanks, in the other direction.
      #
      # This is the one process permitted a model client, and the price of that
      # permission is that it cannot reach an order: the import test forbids it
      # importing `src.execution` or `src.worker`. That says nothing about a key
      # already sitting in its environment, and a venue key needs no import to
      # use — one HTTP request with two headers places an order. Without these
      # lines it inherits the broker pair from the shared env_file, and "it
      # holds no broker credentials", which programme.yml says of the
      # deployment, was false here.
      #
      # BANKR_API_KEY belongs to src/bankr_client.py, which nothing runs today.
      # It is a venue key all the same, for a venue that trades on a prompt,
      # and `.env.example` invites an operator to fill it in.
      ALPACA_KEY_ID: ""
      ALPACA_SECRET_KEY: ""
      BANKR_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy

  # Local testing only. Not in the default set: production is Vercel.
  web:
    profiles: ["web"]
    build: ./web
    environment:
      # Read by the browser, so it must be an address the *browser* can reach —
      # not the compose-internal hostname `api`, which resolves only between
      # containers.
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
