# jev-check.yml
# -------------
# Whether the TypeSafe key works, asked of TypeSafe's own API, on demand.
#
# The key exists in exactly one place this repository controls: the Actions
# secret store, as TYPESAFE_API_KEY. So a check that needs it can only run here,
# as broker-check.yml does for the paper venue. `python -m src.programme.jev_check`
# lists the models the key may use (no tokens), asks the connectivity probe once
# through the shipped client, and judges the answer as the lane would. It
# records nothing and prints no secret.
#
# `workflow_dispatch` only: a schedule would spend the key on nobody's behalf.
#
# What this job holds, and why that is all it holds
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# The model key and nothing else: no DATABASE_URL, no SECRETS_KEY, no venue
# key, and a token that can only read. It installs the programme's lock — the
# one place besides programme.yml and CI's SDK job allowed a model SDK —
# because it runs the programme's own client, and it may for the same reason
# CI's job may: nothing else in the process is worth taking.
# tests/unit/test_dependency_boundaries.py holds it to exactly that.

name: jev-check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-check
  cancel-in-progress: false

jobs:
  jev-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-programme.lock

      # Exactly as programme.yml installs it: every file checked against the
      # lock's sha256, wheels only. A block scalar because `:all: ` in a plain
      # one is a YAML mapping.
      - run: |
          pip install --require-hashes --only-binary :all: -r requirements-programme.lock

      - name: Ask Jev one question with the stored key
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.programme.jev_check
