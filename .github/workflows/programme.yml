# programme.yml
# -------------
# The AI programme, on the same host as the worker and for the same reason.
#
# `src/programme` is a third long-lived process. Render has no free tier for a
# background worker and Vercel has no long-lived process at all, so the runner
# that already keeps `src/worker` alive keeps this one alive too. It runs
# `python -m src.programme.main` unchanged — the same module, the same
# fail-closed switches, the same heartbeat row.
#
# Why it is a separate workflow from the worker
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Not tidiness. This is the only long-running workflow that installs the model
# SDKs, `anthropic` and `typesafe-sdk`, beside a credential. (CI's `programme
# sdk` job installs the same lock to test the Jev client, and may only because
# it holds no secret at all; `jev-check.yml` installs it by dispatch with the
# TypeSafe key alone.) `src/api` and `src/worker` are
# forbidden from importing an LLM client by
# `tests/unit/test_import_boundaries.py`, and `src/programme` is forbidden from
# importing anything that can submit an order. Running both in one job would
# put the SDKs in the same process tree as the broker credentials, which is
# exactly the separation the tests exist to keep.
#
# It also means the programme can fail, be disabled, or run out of API credit
# without touching the worker that writes `daily_marks` — and both halting
# limits are measured against that table.
#
# What this does NOT make safe
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Nothing about trading. This process cannot place an order: it may not import
# `src.execution` or `src.worker`, it holds no broker credentials, and
# `LIVE_TRADING_ENABLED` and `ALPACA_ALLOW_LIVE` are absent from the
# environment below and therefore false.
#
# Nor does deploying it turn it on. `programme_enabled` is seeded false by
# migration 0007 and read fail-closed, and `programme_max_auto_stage` is seeded
# zero, so a freshly deployed runner evaluates gates, records judgements and
# promotes nothing until an operator says otherwise from the Programme page.
# Arriving deployed-but-inert is the intended state.

name: programme

# Restarts at fixed times, and none after a close
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# A run used to stop after a fixed 5h45m while the cron, "30 */5 * * *", fired
# every five hours, so a successor was always queued and each restart came
# 5h45m after the last: the restarts drifted round the clock, 45 minutes a
# run, and every few days one landed between an NYSE close and its decision
# cutoff, where the forward clock collects the day's regime (close + 50 minutes)
# before the cutoff (close + 60), and a session missed is missed for good. The
# cron itself fired at 20:30, half an hour after a summer close.
#
# Now each run stops at the next of five slots, 02:30, 07:30, 12:30, 17:00 and
# 22:30 UTC, at least ten minutes away, so the process restarts at a slot and
# nowhere else. No slot falls from 20:30 to 22:15 UTC — the ingest, the
# regime, the cutoff and the marks after an ordinary close, in summer and in
# winter — nor near a half day's close or the open.
#
# Each slot has two triggers, and neither is at the slot or on the hour.
# GitHub delays scheduled events, most at the top of the hour, and under load
# drops some; a trigger at the moment a run stops would find nothing running
# to queue behind, and every restart would last as long as it was late.
#
# - 41 minutes before the slot, while the run that stops there still runs:
#   the new run waits, pending, and starts as the old one exits, so the
#   restart takes the minutes a runner needs and waits on no schedule.
# - 3 minutes after it. Ordinarily it finds the successor running, waits
#   pending behind it, and is replaced by the next slot's earlier trigger, so
#   five runs a day end "cancelled", by design. When that earlier trigger is
#   late past its slot or lost, this one is already queued and takes its
#   place; and when nothing is running at all — the first deploy, or both
#   triggers lost — it starts the chain again.
#
# `worker.yml` restarts at the same slots on the same triggers, and
# `tests/unit/test_jev_clock.py` runs this step's arithmetic, models the
# schedule late, erratic and losing an event, and holds every restart outside
# every session's working hours.
on:
  schedule:
    - cron: "49 1,6,11,21 * * *"
    - cron: "19 16 * * *"
    - cron: "33 2,7,12,22 * * *"
    - cron: "3 17 * * *"
  workflow_dispatch:

# Queue, never overlap. Two runners would both claim requested ticks — the
# claim uses FOR UPDATE SKIP LOCKED so it is safe — but a second one buys
# nothing and doubles the model spend.
concurrency:
  group: programme
  cancel-in-progress: false

jobs:
  programme:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-programme.lock

      # The programme's lock, installed exactly as Dockerfile.programme
      # installs it: every file checked against the sha256 the lock records,
      # and wheels only, because pip does not hash-check what it fetches to
      # build an sdist. A cache that served a different file would fail the
      # check rather than reach this process, which holds the database and
      # the model credentials. A block scalar because `:all: ` in a plain one
      # is a YAML mapping, and a workflow that does not parse never runs.
      - run: |
          pip install --require-hashes --only-binary :all: -r requirements-programme.lock

      - name: Run the programme until just short of the job limit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Absent is fine and is the expected state on a first deploy. Without
          # it the runner still reconciles experiments, evaluates gates,
          # promotes candidates and queues shadow sessions; it simply proposes
          # no new hypotheses and convenes no panel.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # TypeSafe's key, for the Jev lanes, on the same terms: absent is
          # fine and is the expected state. Every Jev switch is seeded off and
          # read fail-closed, so a key here calls nothing until an operator
          # switches Jev on, and without one the lanes ask nothing and log so.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Decrypts the model credentials an operator set from the UI. The
          # runner reads the vault first and the environment variables above
          # second, so without this key the rows in `secrets` are unreadable
          # and those fallbacks are all there is.
          #
          # Deliberately absent from `worker.yml`. That job holds the broker
          # credentials and is the only thing here that submits an order; it can
          # read every row in the database, so the key is what stops it reading
          # a model credential. `tests/unit/test_secret_isolation.py` asserts
          # both directions against these files.
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
          # Recorded on every experiment row, so a result can be reproduced
          # from the commit that produced it.
          GIT_COMMIT: ${{ github.sha }}
          PROGRAMME_TICK_SECONDS: "3600"
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          # `+e` for the same reason as worker.yml: a `run:` block executes
          # under `bash -e`, so 124 exited the script before `code=$?` and the
          # branch calling it a success was unreachable.
          set +e
          # Stop at the next restart slot at least ten minutes away, never
          # later than 5h45m from now: the slots' gaps are at most 5h30m, so a
          # run always stops at a slot, and the trigger 41 minutes before it
          # has queued the run that takes over. See the header. Unix time
          # counts no leap seconds, so today's UTC midnight is `now` less its
          # remainder of a day.
          now=$(date -u +%s)
          midnight=$((now - now % 86400))
          seconds=20700
          for day in 0 1; do
            for slot in 02:30 07:30 12:30 17:00 22:30; do
              at=$((midnight + day * 86400 + 10#${slot%:*} * 3600 + 10#${slot#*:} * 60))
              if [ $((at - now)) -ge 600 ] && [ $((at - now)) -lt "$seconds" ]; then
                seconds=$((at - now))
              fi
            done
          done
          # SIGTERM, not SIGKILL: `main.py` installs a handler that finishes
          # the tick in flight, records it on its `programme_runs` row and
          # closes the pool. A killed tick would leave a row stuck 'running'.
          # A Jev job in flight is given 35 s to finish and be recorded, inside
          # the 60 s `--kill-after` allows.
          timeout --signal=TERM --kill-after=60 "$seconds" python -m src.programme.main
          code=$?
          # 124 is `timeout` stopping a healthy process, which is how every
          # run is meant to end.
          if [ "$code" -eq 124 ]; then exit 0; fi
          exit "$code"
