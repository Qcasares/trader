# worker.yml
# ----------
# The worker, on a host that does not charge for it.
#
# `render.yaml` gives `trader-worker` its own long-lived service, and that is
# still the right shape. Render has no free tier for a background worker, so on
# the deployment this repository currently runs there is no process to claim a
# job — `daily_marks` is never written, and because both halting limits are
# measured against that table, they go inert. The System page reports "no
# worker is alive", which is exactly the thing that would be true.
#
# This repository is public, so GitHub Actions minutes are unmetered. That is
# what makes a runner a plausible place to put a worker rather than a joke: it
# runs `python -m src.worker.main` unchanged — the same module, the same
# handlers, the same heartbeat — against the deployed database.
#
# Continuity, not a cron. A job is capped at six hours, so each run stops
# itself at the next restart slot, at most 5h45m away, and the schedule below
# queues its successor while it still runs. The `concurrency` group means the
# next run does not start alongside the current one; it waits, pending, and
# takes over as the current one exits. Coverage is continuous but for the
# minutes a successor takes to start, which is the property that matters — an
# end-of-day mark missed is a halting limit disarmed for a day.
#
# What this does NOT make safe: live trading. `LIVE_TRADING_ENABLED` and
# `ALPACA_ALLOW_LIVE` are absent from the environment below and therefore
# false, the deployment's own mode is the third gate, and the database kill
# switch sits on top of all three and fails closed. This worker runs research,
# ingest, marks and reconciliation. Arming real money is a separate, deliberate
# act, and it should be done on a host you pay for.

name: worker

# Restarts at fixed times, and none after a close
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# A run used to stop after a fixed 5h45m while the cron, "0 */5 * * *", fired
# every five hours, so a successor was always queued and each restart came
# 5h45m after the last: the restarts drifted round the clock, 45 minutes a
# run, and every few days one landed in the hour after a close, when this
# worker ingests the session's bars (close + 45 minutes), fetches the forward
# clock's reference bars in the same minute, decides (close + 60) and marks the
# book (close + 75). The cron itself fired at 20:00, the summer close.
#
# Now each run stops at the next of five slots, 02:30, 07:30, 12:30, 17:00 and
# 22:30 UTC, at least ten minutes away, so the worker restarts at a slot and
# nowhere else: never from 20:30 to 22:15 UTC, after an ordinary close in
# summer or winter, nor near a half day's close or the open.
#
# Each slot has two triggers, and neither is at the slot or on the hour.
# GitHub delays scheduled events, most at the top of the hour, and under load
# drops some; a trigger at the moment a run stops would find nothing running
# to queue behind, and every restart would last as long as it was late.
#
# - 41 minutes before the slot, while the run that stops there still runs:
#   the new run waits, pending, and starts as the old one exits, so the
#   restart takes the minutes a runner needs and waits on no schedule.
# - 3 minutes after it. Ordinarily it finds the successor running, waits
#   pending behind it, and is replaced by the next slot's earlier trigger, so
#   five runs a day end "cancelled", by design. When that earlier trigger is
#   late past its slot or lost, this one is already queued and takes its
#   place; and when nothing is running at all — the first deploy, or both
#   triggers lost — it starts the chain again.
#
# `programme.yml` restarts at the same slots on the same triggers, and
# `tests/unit/test_jev_clock.py` runs this step's arithmetic, models the
# schedule late, erratic and losing an event, and holds every restart outside
# every session's working hours.
on:
  schedule:
    - cron: "49 1,6,11,21 * * *"
    - cron: "19 16 * * *"
    - cron: "33 2,7,12,22 * * *"
    - cron: "3 17 * * *"
  workflow_dispatch:

# Queue, never overlap. Two workers claiming concurrently is safe — `claim`
# uses FOR UPDATE SKIP LOCKED — but the free database has few connections to
# spare and one worker is enough for one deployment.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    # Above the 345 minutes below, so the step's own stop is what ends the run
    # and GitHub's kill is only the backstop.
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requirements.txt, not requirements-dev.txt: this is a deployment, and
      # it should install what a deployment installs.
      - run: pip install -r requirements.txt

      - name: Run the worker until just short of the job limit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Distinguishable in `worker_heartbeats` from a worker running
          # anywhere else, so "which one is alive" has an answer.
          WORKER_ID: gha-${{ github.run_id }}
          PYTHONUNBUFFERED: "1"

          # Paper credentials, and the venue enforces that rather than trusting
          # this comment: a key issued for paper is refused by
          # api.alpaca.markets with a 401, exactly as a live key is refused by
          # paper-api. That check is worth running on any key before it is
          # stored — a key pasted from the dashboard's live view looks
          # identical apart from its prefix.
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"

          # The two environment gates, stated rather than omitted. Absent, they
          # default to false and the behaviour is identical — but a reader
          # asking "can this runner reach a live venue?" should find the answer
          # here rather than infer it from a missing line. The deployment's own
          # mode is the third gate and the database kill switch sits above all
          # three.
          LIVE_TRADING_ENABLED: "false"
          ALPACA_ALLOW_LIVE: "false"
        run: |
          set -uo pipefail
          # `+e` is the whole point of the next four lines existing. GitHub
          # runs a `run:` block under `bash -e`, so `timeout`'s 124 aborted the
          # script here — before `code=$?` was ever reached — and the branch
          # below that calls 124 a success never ran. Every scheduled worker
          # run went red while the worker itself was healthy, which trains an
          # operator to ignore the one signal that says the worker died.
          set +e
          # Stop at the next restart slot at least ten minutes away, never
          # later than 5h45m from now: the slots' gaps are at most 5h30m, so a
          # run always stops at a slot, and the trigger 41 minutes before it
          # has queued the run that takes over. See the header. Unix time
          # counts no leap seconds, so today's UTC midnight is `now` less its
          # remainder of a day.
          now=$(date -u +%s)
          midnight=$((now - now % 86400))
          seconds=20700
          for day in 0 1; do
            for slot in 02:30 07:30 12:30 17:00 22:30; do
              at=$((midnight + day * 86400 + 10#${slot%:*} * 3600 + 10#${slot#*:} * 60))
              if [ $((at - now)) -ge 600 ] && [ $((at - now)) -lt "$seconds" ]; then
                seconds=$((at - now))
              fi
            done
          done
          # SIGTERM, not SIGKILL: `main.py` installs a handler that finishes
          # the job in flight and closes the pool. --kill-after is the
          # guarantee that a wedged process still exits.
          timeout --signal=TERM --kill-after=60 "$seconds" python -m src.worker.main
          code=$?
          # 124 is `timeout` reporting it had to stop a healthy worker, which
          # is the expected end of every run. Anything else is a real failure
          # and should turn the run red.
          if [ "$code" -eq 124 ]; then exit 0; fi
          exit "$code"
