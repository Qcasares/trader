# drain.yml
# ---------
# Runs the queued research jobs on a deployment that has no background worker.
#
# `render.yaml` describes the intended topology, in which `trader-worker` is a
# long-lived process and nothing here is needed. Render has no free tier for a
# background worker, so the deployment this repository currently runs on has
# only the API — and `SERVERLESS_DRAIN_ENABLED` lets that API run backtest and
# walk-forward jobs itself. Something still has to ask it to.
#
# Vercel Cron is the scheduler `vercel.json` names, and it is capped at one run
# per day on the free plan. A queued backtest waiting up to 24 hours is not a
# working research loop, so the schedule lives here instead, where ten minutes
# is allowed.
#
# The same request keeps the free Render instance awake. That is a side effect
# and not the reason: an instance that has spun down still answers, after a
# cold start of roughly a minute.
#
# The drain never runs a trading job — `src/api/drain.py` restricts itself to
# `backtest` and `walkforward`, so an HTTP request cannot place an order. Live
# trading needs the real worker, and therefore a paid instance.

name: drain

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# A slow drain must not have a second one started on top of it. Jobs are
# claimed with `FOR UPDATE SKIP LOCKED` so an overlap would be safe, but
# queueing rather than overlapping keeps the free instance's single worker
# thread doing one thing at a time.
concurrency:
  group: drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the control plane to run queued research jobs
        env:
          API_BASE: ${{ vars.API_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # --max-time covers the cold start of a spun-down free instance,
          # which is the slowest this call ever legitimately is.
          response=$(curl --silent --show-error --max-time 180 \
            --write-out '\n%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --request POST "${API_BASE}/api/v1/system/drain")
          body=$(printf '%s' "$response" | sed '$d')
          code=$(printf '%s' "$response" | tail -n1)
          echo "$body"
          # A drain that returns 401 or 503 is a broken deployment, not a quiet
          # no-op, and the run should go red so it is visible in the checks list.
          test "$code" = "200"
